name: Install Shopify theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install theme files when package exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f theme-package.b64 ]; then
            echo "No theme-package.b64 found; nothing to install."
            exit 0
          fi
          base64 -d theme-package.b64 > /tmp/shopify-theme.zip
          unzip -oq /tmp/shopify-theme.zip -d .
          rm -f theme-package.b64 /tmp/shopify-theme.zip

      - name: Commit installed theme
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install final Shopify theme"
          git push
