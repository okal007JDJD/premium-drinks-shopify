name: Install Shopify theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install final theme package
        shell: bash
        run: |
          set -euo pipefail
          required=(theme-package.part01 theme-package.part02 theme-package.part03 theme-package.part04a theme-package.part04b theme-package.part05)
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Waiting for $f"
              exit 0
            fi
          done
          echo "Package diagnostics:"
          wc -c "${required[@]}"
          sha256sum "${required[@]}"
          cat "${required[@]}" > /tmp/theme-package.b64
          base64 -d /tmp/theme-package.b64 > /tmp/shopify-theme.zip
          unzip -t /tmp/shopify-theme.zip
          unzip -oq /tmp/shopify-theme.zip -d .
          rm -f theme-package.part01 theme-package.part02 theme-package.part03 theme-package.part04 theme-package.part04a theme-package.part04b theme-package.part05 /tmp/theme-package.b64 /tmp/shopify-theme.zip

      - name: Commit installed theme
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install final Shopify theme"
          git push
